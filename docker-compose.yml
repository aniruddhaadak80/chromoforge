services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - NEXT_TELEMETRY_DISABLED=1
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/"]
      interval: 30s
      timeout: 5s
      retries: 3

  # Optional accelerator — the app is fully functional without it.
  agents:
    build:
      context: ./services/agents
      dockerfile: Dockerfile
    ports:
      - "8787:8787"
    environment:
      - AGENTS_SERVICE_TOKEN=
    profiles: [agents]
