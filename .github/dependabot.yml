version: 2
updates:
  - package-ecosystem: bun
    directory: "/"
    schedule:
      interval: weekly
      day: saturday
    open-pull-requests-limit: 5
    labels: [dependencies]
    ignore:
      - dependency-name: "typescript"
      - dependency-name: "@eslint/js"
        update-types: ["version-update:semver-major"]
        update-types: ["version-update:semver-major"]
    groups:
      next-ecosystem:
        patterns: ["next", "next-*", "react", "react-dom", "@types/react*"]
      testing:
        patterns: ["vitest", "@playwright/test", "playwright*", "@axe-core/*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels: [ci]
  - package-ecosystem: cargo
    directory: "/crates/ecology"
    schedule:
      interval: monthly
    labels: [rust]
  - package-ecosystem: pip
    directory: "/python/agents"
    schedule:
      interval: monthly
    labels: [python]
