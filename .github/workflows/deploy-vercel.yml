name: deploy-vercel

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run build
      - name: Prepare Vercel build
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bunx vercel pull --yes --environment=production --token "$VERCEL_TOKEN"
          bunx vercel build --prod --token "$VERCEL_TOKEN"
      # Only the final deploy call counts against the Vercel free tier's
      # 100 deployments/day quota; dependabot pushes to main can exhaust it
      # before UTC midnight. Surface the step as failed but keep CI green —
      # the last good deployment keeps serving and the check below verifies it.
      - name: Deploy to Vercel
        continue-on-error: true
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          bunx vercel deploy --prebuilt --prod --token "$VERCEL_TOKEN"
      - name: Verify the live URL responds
        run: |
          URL="https://chromoforge.vercel.app"
          curl -sI "$URL" | head -1
          curl -s "$URL" | grep -c chromoforge
