name: release

on:
  push:
    tags: ["v*"]

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - run: bun install --frozen-lockfile
      - run: bun run typecheck && bun run lint && bun run test && bun run build
      - name: Build the changelog body
        id: notes
        run: |
          prev=$(git describe --tags --abbrev=0 "$GITHUB_REF_NAME^" 2>/dev/null || echo "")
          if [ -n "$prev" ]; then
            git log --pretty='- %s (%h)' "$prev..$GITHUB_REF_NAME" > RELEASE_NOTES.md
          else
            git log --pretty='- %s (%h)' -20 > RELEASE_NOTES.md
          fi
          node scripts/loc-count.mjs >> RELEASE_NOTES.md || true
      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
